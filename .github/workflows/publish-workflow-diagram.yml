name: Publish workflow diagram

on:
  push:
    branches:
      - main
    paths:
      - docs/foundry-agent-chat-workflow-interactive.html
      - .archify/workflow-code-interpreter-20261005-114243/code-interpreter-analysis.html
      - .archify/workflow-foundry-web-search-vs-openapi-20261006-143303/foundry-web-search-vs-openapi.html
      - .archify/workflow-foundry-tools-vs-toolbox-20261006-160503/foundry-tools-vs-toolbox.html
      - .github/workflows/publish-workflow-diagram.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare the diagram site
        run: |
          mkdir -p _site
          cp docs/foundry-agent-chat-workflow-interactive.html _site/index.html
          mkdir -p _site/code-interpreter
          cp .archify/workflow-code-interpreter-20261005-114243/code-interpreter-analysis.html _site/code-interpreter/index.html
          mkdir -p _site/tool-selection
          cp .archify/workflow-foundry-web-search-vs-openapi-20261006-143303/foundry-web-search-vs-openapi.html _site/tool-selection/index.html
          mkdir -p _site/tools-vs-toolbox
          cp .archify/workflow-foundry-tools-vs-toolbox-20261006-160503/foundry-tools-vs-toolbox.html _site/tools-vs-toolbox/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
