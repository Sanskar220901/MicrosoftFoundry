name: Publish workflow diagram

on:
  push:
    branches:
      - main
    paths:
      - docs/foundry-agent-chat-workflow-interactive.html
      - .github/workflows/publish-workflow-diagram.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare the diagram site
        run: |
          mkdir -p _site
          cp docs/foundry-agent-chat-workflow-interactive.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
